name: Auto Sync & Health Repair Engine

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-and-repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Step 1 - Smart Incremental Ingestion & Multi-Format Export
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          MAIN_SOURCE_URL: ${{ secrets.MAIN_SOURCE_URL }}
        run: |
          python scripts/scraper.py

      - name: Step 2 - Chunked Dead Link Health Check & Auto-Repair
        run: |
          python scripts/repair_links.py

      - name: Commit and Push Updated Datasets & Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync (6h cycle): Incremental ingestion, M3U/TXT export & health check repair [skip ci]" && git push)
